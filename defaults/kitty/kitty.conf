# Sajan's Ubuntu - Kitty terminal configuration
# See https://sw.kovidgoyal.net/kitty/conf/

# Font (matches the system monospace font set in set-gnome-settings.sh)
font_family      Hack Nerd Font Mono
bold_font       auto
italic_font     auto
font_size       11.0

# Cursor
cursor          beam
cursor_blink    yes

# Tabs / layout
tab_bar_style   powerline
background_opacity 1.0

# Scrollback
scrollback_lines 10000

# Theme (monochrome-friendly defaults; override per theme if desired)
background      #1e1e1e
foreground      #d4d4d4
