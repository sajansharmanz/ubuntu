# Sajan's Ubuntu - Kitty terminal configuration
# See https://sw.kovidgoyal.net/kitty/conf/

#: Fonts {{{

font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.0

#: }}}

#: Text cursor customization {{{

# cursor #cccccc

#: Default text cursor color. If set to the special value none the
#: cursor will be rendered with a "reverse video" effect.

# cursor_text_color #111111

#: The color of text under the cursor.

cursor_shape beam

#: The cursor shape can be one of block, beam, underline.

# cursor_shape_unfocused hollow

#: Defines the text cursor shape when the OS window is not focused.

# cursor_beam_thickness 1.5

#: The thickness of the beam cursor (in pts).

# cursor_underline_thickness 2.0

#: The thickness of the underline cursor (in pts).

cursor_blink_interval -1

#: The interval to blink the cursor (in seconds). Set to zero to
#: disable blinking. Negative values mean use system default.

# cursor_stop_blinking_after 15.0

#: Stop blinking cursor after the specified number of seconds of
#: keyboard inactivity. Set to zero to never stop blinking.

# cursor_trail 0

#: Set this to a value larger than zero to enable a "cursor trail"
#: animation.

# cursor_trail_decay 0.1 0.4

#: Controls the decay times for the cursor trail effect.

# cursor_trail_start_threshold 2

#: Set the distance threshold for starting the cursor trail.

# cursor_trail_color none

#: Set the color of the cursor trail when cursor_trail is enabled.

#: }}}

#: Scrollback {{{

scrollback_lines 10000

#: Number of lines of history to keep in memory for scrolling back.

# scrollbar scrolled

#: Control when the scrollbar is displayed.

# scrollbar_interactive yes

#: If disabled, the scrollbar will not be controllable via the mouse.

# scrollbar_jump_on_click yes

#: When enabled clicking in the scrollbar track will cause the scroll
#: position to jump to the clicked location.

# scrollbar_width 0.5

#: The width of the scroll bar in units of cell width.

# scrollbar_hover_width 1

#: The width of the scroll bar when the mouse is hovering over it.

# scrollbar_handle_opacity 0.5

#: The opacity of the scrollbar handle, 0 being fully transparent and
#: 1 being full opaque.

# scrollbar_radius 0.3

#: The radius (curvature) of the scrollbar handle.

# scrollbar_gap 0.1

#: The gap between the scrollbar and the window edge.

# scrollbar_min_handle_height 1

#: The minimum height of the scrollbar handle.

# scrollbar_hitbox_expansion 0.25

#: The extra area around the handle to allow easier grabbing.

# scrollbar_track_opacity 0

#: The opacity of the scrollbar track.

# scrollbar_track_hover_opacity 0.1

#: The opacity of the scrollbar track when the mouse is over it.

# scrollbar_handle_color foreground

#: The color of the scrollbar handle.

# scrollbar_track_color foreground

#: The color of the scrollbar track.

# progress_bar top

#: When a program uses the OSC 9;4 escape sequence to report progress,
#: draw a progress bar in the specified position of the window.

# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

#: Program with which to view scrollback in a new window.

# scrollback_pager_history_size 0

#: Separate scrollback history size (in MB), used only for browsing
#: the scrollback buffer with pager.

# scrollback_fill_enlarged_window no

#: Fill new space with lines from the scrollback buffer after
#: enlarging a window.

# wheel_scroll_multiplier 5.0

#: Multiplier for the number of lines scrolled by the mouse wheel.

# wheel_scroll_min_lines 1

#: The minimum number of lines scrolled by the mouse wheel.

# touch_scroll_multiplier 1.0

#: Multiplier for the number of lines scrolled by a touchpad.

# pixel_scroll yes

#: Enable per-pixel scrolling in the kitty scrollback buffer.

# momentum_scroll 0.96

#: The amount of friction to apply to slow down momentum scrolling.

#: }}}

#: Mouse {{{

# mouse_hide_wait 3.0

#: Hide mouse cursor after the specified number of seconds.

# url_color #0087bd
# url_style curly

#: The color and style for highlighting URLs on mouse-over.

# open_url_with default

#: The program to open clicked URLs.

# url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

#: The set of URL prefixes to look for when detecting a URL.

# detect_urls yes

#: Detect URLs under the mouse.

# url_excluded_characters

#: Additional characters to be disallowed from URLs.

# show_hyperlink_targets never

#: When the mouse hovers over a terminal hyperlink, show the actual URL.

# underline_hyperlinks hover

#: Control how hyperlinks are underlined.

# copy_on_select no

#: Copy to clipboard or a private buffer on select.

# clear_selection_on_clipboard_loss no

#: When the contents of the clipboard no longer reflect the current
#: selection, clear it.

# paste_actions quote-urls-at-prompt,confirm

#: A comma separated list of actions to take when pasting or dropping
#: text into the terminal.

# strip_trailing_spaces never

#: Remove spaces at the end of lines when copying to clipboard.

# select_by_word_characters @-./_~?&=%+#

#: Characters considered part of a word when double clicking.

# select_by_word_characters_forward

#: Characters considered part of a word when extending the selection
#: forward on double clicking.

# click_interval -1.0

#: The interval between successive clicks to detect double/triple
#: clicks (in seconds).

# focus_follows_mouse no

#: Set the active window to the window under the mouse.

# pointer_shape_when_grabbed arrow

#: The shape of the mouse pointer when the program running in the
#: terminal grabs the mouse.

# default_pointer_shape beam

#: The default shape of the mouse pointer.

# pointer_shape_when_dragging beam crosshair

#: The default shape of the mouse pointer when dragging across text.

# drag_threshold 5

#: The threshold distance the mouse must move to start a drag and
#: drop.

#: Mouse actions {{{

#: Mouse buttons can be mapped to perform arbitrary actions.

# clear_all_mouse_actions no

#: Remove all mouse action definitions up to this point.

# mouse_map left click ungrabbed mouse_handle_click selection link prompt

#: Click the link under the mouse or move the cursor

# mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt

#: Click the link under the mouse or move the cursor even when grabbed

# mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link

#: Click the link under the mouse cursor

# mouse_map ctrl+shift+left press grabbed discard_event

#: Discard press event for link click

# mouse_map middle release ungrabbed paste_from_selection

#: Paste from the primary selection

# mouse_map left press ungrabbed mouse_selection normal

#: Start selecting text

# mouse_map ctrl+alt+left press ungrabbed mouse_selection rectangle

#: Start selecting text in a rectangle

# mouse_map left doublepress ungrabbed mouse_selection word

#: Select a word

# mouse_map left triplepress ungrabbed mouse_selection line

#: Select a line

# mouse_map alt+left triplepress ungrabbed mouse_selection line_from_begin

#: Select line from first cell

# mouse_map ctrl+alt+left triplepress ungrabbed mouse_selection line_from_point

#: Select line from point

# mouse_map right press ungrabbed mouse_selection extend

#: Extend the current selection

# mouse_map shift+left press ungrabbed mouse_selection extend

#: Extend the current selection with shift

# mouse_map shift+middle release ungrabbed,grabbed paste_selection
# mouse_map shift+middle press grabbed discard_event

#: Paste from the primary selection even when grabbed

# mouse_map shift+left press grabbed mouse_selection normal

#: Start selecting text even when grabbed

# mouse_map ctrl+shift+alt+left press ungrabbed,grabbed mouse_selection rectangle

#: Start selecting text in a rectangle even when grabbed

# mouse_map shift+left doublepress ungrabbed,grabbed mouse_selection word

#: Select a word even when grabbed

# mouse_map shift+left triplepress ungrabbed,grabbed mouse_selection line

#: Select a line even when grabbed

# mouse_map shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_begin

#: Select line from first cell even when grabbed

# mouse_map ctrl+shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_point

#: Select line from point even when grabbed

# mouse_map shift+right press ungrabbed,grabbed mouse_selection extend

#: Extend the current selection even when grabbed

# mouse_map ctrl+shift+right press ungrabbed mouse_show_command_output

#: Show clicked command output in pager

#: }}}

#: }}}

#: Performance tuning {{{

# repaint_delay 10

#: Delay between screen updates (in milliseconds).

# input_delay 3

#: Delay before input from the program running in the terminal is
#: processed (in milliseconds).

# sync_to_monitor yes

#: Sync screen updates to the refresh rate of the monitor.

#: }}}

#: Terminal bell {{{

# enable_audio_bell yes

#: The audio bell.

# visual_bell_duration 0.0

#: The visual bell duration (in seconds).

# visual_bell_color none

#: The color used by visual bell.

# window_alert_on_bell yes

#: Request window attention on bell.

# bell_on_tab "🔔 "

#: Some text or a Unicode symbol to show on the tab if a window in the
#: tab that does not have focus has a bell.

# command_on_bell none

#: Program to run when a bell occurs.

# macos_dock_badge_on_bell yes

#: Show a badge on kitty's dock icon when a bell occurs (macOS only).

# bell_path none

#: Path to a sound file to play as the bell sound.

# linux_bell_theme __custom

#: The XDG Sound Theme kitty will use to play the bell sound.

#: }}}

#: Window layout {{{

remember_window_size  yes
initial_window_width  640
initial_window_height 400

#: If enabled, the OS Window size will be remembered so that new
#: instances of kitty will have the same size as the previous instance.

# remember_window_position no

#: If enabled, the OS Window position will be remembered.

# enabled_layouts *

#: The enabled window layouts.

# window_resize_step_cells 2
# window_resize_step_lines 2

#: The step size to use when resizing kitty windows.

# window_border_width 0.5pt

#: The width of window borders.

# draw_minimal_borders yes

#: Draw only the minimum borders needed.

# draw_window_borders_for_single_window no

#: Draw borders around a window even when there is only a single window.

# window_margin_width 0

#: The window margin (in pts).

# single_window_margin_width -1

#: The window margin to use when only a single window is visible.

# window_padding_width 0

#: The window padding (in pts).

# single_window_padding_width -1

#: The window padding to use when only a single window is visible.

# placement_strategy center

#: When the window size is not an exact multiple of the cell size.

# active_border_color #00ff00

#: The color for the border of the active window.

# inactive_border_color #cccccc

#: The color for the border of inactive windows.

# bell_border_color #ff5a00

#: The color for the border of inactive windows in which a bell has occurred.

# inactive_text_alpha 1.0

#: Fade the text in inactive windows.

# hide_window_decorations no

#: Hide the title bar and window borders.

# confirm_os_window_close -1

#: Ask for confirmation when closing an OS window.

#: }}}

#: Tab bar {{{

tab_bar_style powerline

#: The tab bar style. Can be one of: fade, separator, powerline, hidden.

# tab_powerline_style arrow

#: The powerline style for the tab bar. Can be one of: arrow, round, slanted.

# tab_bar_min_tabs 2

#: The minimum number of tabs that must be present before the tab bar is shown.

# tab_bar_edge bottom

#: The edge to show the tab bar on. Can be one of: bottom, top.

# tab_bar_margin_width 0.0

#: The margin (in pts) of the tab bar.

# tab_bar_margin_height 0.0

#: The height (in pts) of the top/bottom margin of the tab bar.

# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

#: A template for rendering tab titles.

# active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"

#: A template for rendering the title of the active tab.

# active_tab_font_style bold

#: The font style for the active tab.

# inactive_tab_font_style normal

#: The font style for inactive tabs.

# tab_bar_background none

#: Background color for the tab bar. Set to none to use the default background.

# active_tab_background #000

#: Background color for the active tab.

# inactive_tab_background #444

#: Background color for inactive tabs.

# active_tab_foreground #fff

#: Foreground color for the active tab.

# inactive_tab_foreground #999

#: Foreground color for inactive tabs.

#: }}}

#: Colors {{{

background      #1e1e1e
foreground      #d4d4d4

#: The default foreground and background colors.

# selection_background #b4d0ff

#: The background color for text selections.

# selection_foreground #000000

#: The foreground color for text selections.

# mark1_foreground #ffffff
# mark1_background #ff2026

#: Colors to indicate marked text (select with mark_cmd or mark_url).

# mark2_foreground #ffffff
# mark2_background #20c927

#: Colors to indicate marked text (select with mark_cmd or mark_url).

# mark3_foreground #ffffff
# mark3_background #0071fa

#: Colors to indicate marked text (select with mark_cmd or mark_url).

#: }}}

#: Advanced {{{

# shell_integration enabled

#: Configure shell integration.

# allow_remote_control no

#: Allow remote control connections.

# listen_on none

#: Listen on the specified address for remote control connections.

# mouse_hide_wait 3.0

#: Hide mouse cursor after the specified number of seconds.

# term xterm-kitty

#: The value of the TERM environment variable.

# update_check_interval 24

#: How often to check for kitty updates (in hours).

# allow_hyperlinks yes

#: Allow programs to use the OSC 8 hyperlink escape sequence.

# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

#: Configure how clipboard operations work.

# clipboard_trim_space_at_edges yes

#: Trim leading/trailing spaces from clipboard content.

# enable_audio_bell no

#: Disable the audio bell.

# visual_bell_duration 0.0

#: Disable the visual bell.

#: }}}
